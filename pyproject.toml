[project]
name = "nse-nifty50-scraper"
version = "0.1.0"
description = "Download 30-day NSE historical JSON data for Nifty 50 symbols."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
    "python-dateutil>=2.9.0.post0",
    "typer>=0.16.0",
]

[project.scripts]
nse-fetch = "nse_nifty50_scraper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
