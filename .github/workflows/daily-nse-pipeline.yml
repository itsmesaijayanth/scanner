name: Daily NSE Pipeline

on:
  schedule:
    # GitHub cron is UTC. 11:00 UTC is 4:30 PM Asia/Kolkata.
    - cron: "0 11 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [nse-fetch-trigger, swing-momentum-trigger]

permissions:
  contents: write

jobs:
  pipeline:
    name: Fetch NSE Data and Run Swing Momentum
    runs-on: ubuntu-latest
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_DB: nse_scanner
      MONGO_STRICT: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify MongoDB connection
        run: |
          uv run python -c "
          from nse_nifty50_scraper.db.connection import MongoConnection
          MongoConnection().ping()
          print('Mongo OK')
          "

      - name: Fetch NSE data
        run: uv run nse-fetch --mode daily --days 7

      - name: Commit fetched data
        id: fetch_commit
        run: |
          if [[ -z "$(git status --porcelain -- data/raw data/runs)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_date="$(TZ=Asia/Kolkata date +'%d-%m-%Y')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw data/runs
          git commit -m "chore(data): fetch NSE data for ${run_date}"
          git pull --rebase origin main
          git push

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run swing momentum
        run: uv run swing-momentum --window-days 30

      - name: Commit swing momentum results
        run: |
          if [[ -z "$(git status --porcelain -- data/algo data/runs)" ]]; then
            echo "No swing momentum changes to commit."
            exit 0
          fi

          run_date="$(TZ=Asia/Kolkata date +'%d-%m-%Y')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/algo data/runs
          git commit -m "chore(algo): run swing momentum for ${run_date}"
          git pull --rebase origin main
          git push
